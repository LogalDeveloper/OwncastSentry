name: CD

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  # packages: write  # not yet supported by Gitea

env:
  UV_PYTHON_DOWNLOADS: never

jobs:
  build:
    name: Build
    runs-on: logaldeveloper-archlinux
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Cache uv packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Compute version
        id: version
        run: |
          version=$(uv run hatch version)
          echo "version=$version"
          echo "version=$version" >> "$GITEA_OUTPUT"

      - name: Write version into maubot.yaml
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" maubot.yaml
          grep "^version:" maubot.yaml

      - name: Build plugin
        run: 7z a -tzip -mx=9 -xr!__pycache__ owncastsentry-v${{ steps.version.outputs.version }}.mbp owncastsentry/ maubot.yaml base-config.yaml LICENSE.txt

      - name: Print artifact checksums
        run: |
          echo "MD5: $(md5sum owncastsentry-v${{ steps.version.outputs.version }}.mbp)"
          echo "SHA1: $(sha1sum owncastsentry-v${{ steps.version.outputs.version }}.mbp)"
          echo "SHA256: $(sha256sum owncastsentry-v${{ steps.version.outputs.version }}.mbp)"

      - name: Upload plugin artifact
        uses: https://github.com/christopherhx/gitea-upload-artifact@8818363695ca2d5782c64f6453273341374767b7 # v7
        with:
          path: owncastsentry-v${{ steps.version.outputs.version }}.mbp
          archive: false
