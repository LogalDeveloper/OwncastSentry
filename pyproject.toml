[project]
name = "owncastsentry"
dynamic = ["version"]
description = "A maubot plugin that monitors Owncast streams and sends Matrix notifications"
authors = [
    { name = "Logan Fick" },
]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "maubot[encryption]",
]

[project.urls]
Repository = "https://git.logal.dev/LogalDeveloper/OwncastSentry"

[build-system]
requires = ["hatchling>=1.28.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "hatch>=1.16.5",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "ruff>=0.15.5",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "owncastsentry/_version.py"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true
exclude = ["owncastsentry/_version\\.py"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["owncastsentry/_version.py"]  # auto-generated by hatch-vcs

[tool.ruff.lint]
select = [
    # Core
    "F",     # Pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "N",     # pep8-naming
    "D",     # pydocstyle
    "I",     # isort
    "ICN",   # flake8-import-conventions

    # Correctness & bugs
    "B",     # flake8-bugbear
    "ASYNC", # flake8-async
    "DTZ",   # flake8-datetimez
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "A",     # flake8-builtins
    "PIE",   # flake8-pie

    # Modernization & simplification
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "FLY",   # flynt (f-string conversion)
    "PTH",   # flake8-use-pathlib

    # Performance
    "PERF",  # Perflint

    # Security
    "S",     # flake8-bandit

    # Code hygiene
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "ERA",   # eradicate
    "PGH",   # pygrep-hooks
    "TC",    # flake8-type-checking

    # Ruff-specific
    "RUF",   # Ruff-specific rules
]
ignore = [
    "D203",  # incompatible with D211 (no blank line before class docstring)
    "D213",  # incompatible with D212 (summary on first line)
]

[tool.codespell]
skip = "uv.lock"
