[project]
name = "owncastsentry"
dynamic = ["version"]
description = "A maubot plugin that monitors Owncast streams and sends Matrix notifications"
authors = [
    { name = "Logan Fick" },
]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = ["prometheus_client>=0.25.0"]

[project.urls]
Repository = "https://git.logal.dev/LogalDeveloper/OwncastSentry"

[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "maubot[encryption]>=0.6.0",
    "aioresponses>=0.7.8",
    "codespell>=2.4.2",
    "hatch>=1.16.5",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "time-machine>=3.2.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "owncastsentry/_version.py"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
explicit_package_bases = true
# Maubot's pytest helpers are not fully typed, so strict mypy checks on
# integration tests produce noise around fixture-provided bot/plugin objects.
exclude = ["tests/"]

[tool.ruff]
target-version = "py314"
extend-exclude = ["owncastsentry/_version.py"]  # auto-generated by hatch-vcs

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Any is valid at system boundaries; mypy strict handles real issues
    "C901",    # McCabe complexity: noisy and not actionable
    "COM812",  # handled by the formatter
    "D203",    # incompatible with D211 (no blank line before class docstring)
    "D213",    # incompatible with D212 (summary on first line)
    "EM",      # exception message style: inline literals are fine
    "PLR0911", # too many return statements: flat early-returns are clear
    "PLR0912", # too many branches: inherent in parsers, validators, CLI
    "PLR0913", # too many arguments: API surfaces and constructors need them
    "PLR0915", # too many statements: inherent in parsers, validators, CLI
    "TRY003",  # inline exception messages are fine (complements EM ignore)
    "TRY301",  # raise inside try: guard clauses don't need helper functions
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is standard for pytest
    "S311",     # pseudo-random generators are fine in tests
    "SLF001",   # tests legitimately access private members for verification
    "ARG001",   # unused args are normal for fixtures and handler stubs
    "PLR2004",  # magic values are clear in test assertions
]

[tool.coverage.run]
source = ["owncastsentry"]
omit = ["owncastsentry/_version.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.codespell]
skip = "owncastsentry/_version.py,uv.lock"
